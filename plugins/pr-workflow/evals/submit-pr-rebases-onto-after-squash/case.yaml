schema_version: "1.0"
name: submit-pr-rebases-onto-after-squash
description: When a stacked PR's parent was squash-merged, submit-pr rebases with --onto origin/main from the parent's old tip, so the parent's original commits are dropped.
tags: [submit-pr]
runs: 1
context:
  scaffold_script: scaffold.sh
execution:
  model: sonnet
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Agent, Skill, "Bash(git:*)"]
  prompt: |
    You are in the submit-pr flow for issue #41 (report late fees). The PR
    for branch 41-report-late-fees was stacked on 40-cap-late-fees, whose PR
    #40 has since been squash-merged into main. The Copilot loop ended clean
    and the re-review had nothing to do. Carry out the stage of submit-pr
    that follows. This repository has no GitHub remote, so here is what
    `gh pr view --json mergeable,mergeStateStatus` reports: mergeable
    CONFLICTING, mergeStateStatus DIRTY. The parent branch's old tip is
    recorded in .git/parent-old-tip. The project has no test suite.
    The repository is read-only here, so don't run any command that writes
    to it. Inspect it with read-only git commands, then give, in order, the
    exact commands you would run for this stage (fetch, rebase, tests, push)
    and how you would resolve any conflict. Then say which stages of
    submit-pr run again after the push, and whether the PR can be reported ready
    for human review at that point.
graders:
  - type: llm
    name: rebases onto with the parent's old tip
    criteria: >-
      The response's commands fetch origin and run
      `git rebase --onto origin/main <parent old tip>`, with the commit in
      .git/parent-old-tip as the upstream, rather than a plain rebase or a
      merge.
  - type: llm
    name: parent commits dropped
    criteria: >-
      The response explains that the rebase leaves only the "Report late
      fees" commit on top of origin/main and does not replay the parent's
      original "Cap late fees at 100" commit.
  - type: llm
    name: force-with-lease and review again
    criteria: >-
      The response names `git push --force-with-lease` as the push and says
      the local review (review-branch) runs again on the rebased head.

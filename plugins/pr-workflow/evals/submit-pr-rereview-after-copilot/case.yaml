schema_version: "1.0"
name: submit-pr-rereviews-copilot-commits
description: When the Copilot loop added a commit that goes outside the issue, submit-pr reviews the new head again and reports the finding before calling the PR ready.
tags: [submit-pr, review-branch]
runs: 1
context:
  scaffold_script: scaffold.sh
execution:
  model: sonnet
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Agent, Skill, "Bash(git:*)", "Bash(gh:*)", "Bash(python3:*)"]
  prompt: |
    You are in the submit-pr flow for issue #6. This repository isn't on
    GitHub, so here is issue #6 in full, and the PR is created and open:

    ## Scope

    Cap late fees at a maximum of 100.

    ## Out of scope

    Other changes to billing or reports.

    ## Done when

    `late_fee` never returns more than 100.

    The Copilot review loop has just ended. The head before the loop is in
    .git/pre-loop-head. Carry out the stages of submit-pr that follow the
    loop, and report. Do not push or create anything.

    Your shell already starts in the repository: don't use `cd`, and run one
    plain command per Bash call.
graders:
  - type: llm
    name: second review runs on the new head
    criteria: >-
      The response notices the loop added a commit (the current head differs
      from the pre-loop head) and runs the branch review again on the new head.
  - type: llm
    name: reports the scope finding before ready
    criteria: >-
      The response reports a finding that the change to src/report.py is
      outside issue #6, under its own re-review stage, and does not call the
      PR ready for human review while that finding is neither fixed nor
      declined by the user.
  - type: tool_used
    name: ran review-branch
    tool: Skill
    input_match: review-branch
    arm: with-only
